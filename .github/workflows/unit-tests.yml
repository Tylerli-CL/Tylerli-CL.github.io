name: Site and migration checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run lint:style-contract
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Validate upgrade tooling and production CSS
        run: |
          bash test/integration_upgrade_cli.sh
          bash test/integration_css_minify.sh
      - name: Build production site
        run: npm run build:site
      - name: Verify preserved content, routes and resources
        run: npm run test:content
